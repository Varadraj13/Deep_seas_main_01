<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="var(--fg)">
<title>Deep Seas — Bet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<script src="js/config.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 48px 24px 52px;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* ── Shared ───────────────────────────────── */
  .screen { display: none; flex-direction: column; align-items: center; justify-content: space-between; width: 100%; height: 100%; }
  .screen.active { display: flex; }

  /* ── Page 1 — Signup ─────────────────────── */
  .signup-title {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.8;
  }

  .signup-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 320px;
  }

  .signup-form label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .signup-form input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--fg);
    font-family: inherit;
    font-size: 22px;
    font-weight: 300;
    padding: 10px 0;
    outline: none;
    letter-spacing: 0.04em;
  }

  .signup-form input::placeholder { color: var(--faint); }

  .signup-form input:focus { border-bottom-color: var(--muted); }

  #btnSignup {
    width: 100%;
    min-height: 56px;
    margin-top: 8px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  #btnSignup:hover, #btnSignup:active { border-color: var(--fg); }

  .signup-hint {
    font-size: 9px;
    color: var(--faint);
    letter-spacing: 0.1em;
    text-align: center;
  }

  /* ── Page 2 — Bet ────────────────────────── */
  .question {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.8;
    max-width: 280px;
  }

  .price-wrap { text-align: center; }

  .price-label {
    font-size: 9px;
    color: var(--faint);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  #price {
    font-family: var(--font-data);
    font-size: 72px;
    font-weight: 300;
    letter-spacing: -0.03em;
    color: var(--fg);
    line-height: 1;
    transition: color 0.25s;
  }

  #price.up   { color: var(--green); }
  #price.down { color: var(--red); }

  .contract-line {
    font-size: 9px;
    color: var(--faint);
    letter-spacing: 0.08em;
    text-align: center;
    margin-top: 10px;
    max-width: 300px;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 360px;
  }

  .bet-btn {
    width: 100%;
    min-height: 68px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border: 1px solid;
    cursor: pointer;
    background: transparent;
    transition: background 0.12s, color 0.12s;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }

  #btnOpen   { color: var(--green); border-color: var(--green); }
  #btnClosed { color: var(--red); border-color: var(--red); }

  #btnOpen.flash   { background: var(--green); color: var(--bg); }
  #btnClosed.flash { background: var(--red); color: var(--bg); }

  #btnOpen.cooling, #btnClosed.cooling { opacity: 0.4; pointer-events: none; }

  /* ── Status / toast ──────────────────────── */
  #status {
    font-size: 9px;
    color: var(--faint);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    min-height: 14px;
    transition: color 0.3s;
  }

  #status.warn  { color: var(--muted); }
  #status.error { color: var(--red); }

  #toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--fg);
    border: 1px solid var(--border);
    color: var(--bg);
    font-size: 10px;
    letter-spacing: 0.1em;
    padding: 10px 18px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body class="surface-light">

<!-- Page 1: Signup -->
<div class="screen active" id="screenSignup">
  <div class="signup-title">Deep Seas<br>Prediction Market</div>

  <div class="signup-form">
    <label for="nameInput">Your name</label>
    <input type="text" id="nameInput" placeholder="e.g. Ipsita" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="30">
    <button id="btnSignup" onclick="submitSignup()">Enter the market →</button>
  </div>

  <div class="signup-hint">will the strait of hormuz stay open?</div>
</div>

<!-- Page 2: Bet -->
<div class="screen" id="screenBet">
  <div class="question">Will the Strait of Hormuz remain open?</div>

  <div class="price-wrap">
    <div class="price-label">Market Price</div>
    <div id="price">$50</div>
    <div class="contract-line">You're buying a $50 contract. Market closes when the event resolves.</div>
  </div>

  <div class="buttons">
    <button class="bet-btn" id="btnOpen"   onclick="placeBet('open')">OPEN — $50</button>
    <button class="bet-btn" id="btnClosed" onclick="placeBet('closed')">CLOSED — $50</button>
    <div id="status">connecting…</div>
  </div>
</div>

<div id="toast"></div>

<script>
  // ── Name / screen management ───────────────────────────────────
  let userName = localStorage.getItem('ds_name') || '';

  function submitSignup() {
    const val = document.getElementById('nameInput').value.trim();
    if (!val) return;
    userName = val;
    localStorage.setItem('ds_name', val);
    showBetScreen();
  }

  document.getElementById('nameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitSignup();
  });

  function showBetScreen() {
    document.getElementById('screenSignup').classList.remove('active');
    document.getElementById('screenBet').classList.add('active');
    connect();
  }

  // Auto-skip signup if name already saved
  if (userName) showBetScreen();

  // ── WebSocket with exponential backoff ────────────────────────
  const WS_URL = (typeof SERVER_URL !== 'undefined' ? SERVER_URL : location.origin)
    .replace(/^http/, 'ws');

  const FETCH_URL = typeof SERVER_URL !== 'undefined' ? SERVER_URL : '';

  const priceEl  = document.getElementById('price');
  const statusEl = document.getElementById('status');
  let ws = null;
  let backoffMs = 1000;
  let reconnectTimer = null;
  let prevPrice = 0.5;

  function connect() {
    if (ws && ws.readyState < 2) return; // already open or connecting
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      backoffMs = 1000;
      statusEl.textContent = 'connected';
      statusEl.className = '';
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      const newPrice = msg.marketPrice;
      const dollars = Math.round(newPrice * 100);

      priceEl.textContent = '$' + dollars;
      priceEl.classList.remove('up', 'down');
      if (newPrice > prevPrice) priceEl.classList.add('up');
      else if (newPrice < prevPrice) priceEl.classList.add('down');
      setTimeout(() => priceEl.classList.remove('up', 'down'), 400);
      prevPrice = newPrice;
    };

    ws.onclose = () => {
      statusEl.textContent = 'reconnecting in ' + (backoffMs / 1000).toFixed(0) + 's…';
      statusEl.className = 'warn';
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => {
        backoffMs = Math.min(backoffMs * 2, 30000);
        connect();
      }, backoffMs);
    };

    ws.onerror = () => {
      statusEl.textContent = 'connection error';
      statusEl.className = 'error';
    };
  }

  // ── Betting ────────────────────────────────────────────────────
  let cooldown = false;

  function placeBet(side) {
    if (cooldown) return;

    const btn = side === 'open' ? document.getElementById('btnOpen') : document.getElementById('btnClosed');
    btn.classList.add('flash');
    cooldown = true;
    btn.classList.add('cooling');

    setTimeout(() => {
      btn.classList.remove('flash');
      setTimeout(() => { btn.classList.remove('cooling'); cooldown = false; }, 800);
    }, 300);

    fetch(FETCH_URL + '/bet', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ side, name: userName })
    })
    .then(() => showToast('✓ $50 on ' + side.toUpperCase() + ' · @' + userName))
    .catch(() => { statusEl.textContent = 'bet failed — retry'; statusEl.className = 'error'; });
  }

  // ── Toast ──────────────────────────────────────────────────────
  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
</script>
</body>
</html>
