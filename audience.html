<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Deep Seas — Bet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #ffffff;
    font-family: 'IBM Plex Mono', monospace, monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 40px 24px 48px;
    overflow: hidden;
  }

  .question {
    font-size: 11px;
    color: #555;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.6;
    max-width: 320px;
  }

  .price-wrap {
    text-align: center;
  }

  .price-label {
    font-size: 10px;
    color: #333;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  #price {
    font-size: 72px;
    font-weight: 300;
    letter-spacing: -0.03em;
    color: #ffffff;
    line-height: 1;
    transition: color 0.2s;
  }

  #price.updated {
    color: #4ade80;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 360px;
  }

  .bet-btn {
    width: 100%;
    min-height: 64px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border: 1px solid;
    cursor: pointer;
    background: transparent;
    transition: background 0.15s, color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  #btnOpen {
    color: #4ade80;
    border-color: #4ade80;
  }

  #btnOpen.flash {
    background: #4ade80;
    color: #0a0a0a;
  }

  #btnClosed {
    color: #f87171;
    border-color: #f87171;
  }

  #btnClosed.flash {
    background: #f87171;
    color: #0a0a0a;
  }

  #status {
    font-size: 9px;
    color: #333;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    min-height: 14px;
  }
</style>
</head>
<body>

<div class="question">Will the Strait of Hormuz remain open?</div>

<div class="price-wrap">
  <div class="price-label">Market Price</div>
  <div id="price">50¢</div>
</div>

<div class="buttons">
  <button class="bet-btn" id="btnOpen"  onclick="placeBet('open')">OPEN</button>
  <button class="bet-btn" id="btnClosed" onclick="placeBet('closed')">CLOSED</button>
  <div id="status">connecting...</div>
</div>

<script>
  const priceEl  = document.getElementById('price');
  const statusEl = document.getElementById('status');

  // ── WebSocket ──────────────────────────────────────────────────
  const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(wsProto + '//' + location.host);

  ws.onopen = () => { statusEl.textContent = 'connected'; };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    priceEl.textContent = Math.round(msg.marketPrice * 100) + '¢';
    priceEl.classList.add('updated');
    setTimeout(() => priceEl.classList.remove('updated'), 400);
  };

  ws.onclose = () => { statusEl.textContent = 'reconnecting...'; setTimeout(() => location.reload(), 2000); };
  ws.onerror = () => { statusEl.textContent = 'connection error'; };

  // ── Betting ────────────────────────────────────────────────────
  function placeBet(side) {
    const btn = document.getElementById(side === 'open' ? 'btnOpen' : 'btnClosed');
    btn.classList.add('flash');
    setTimeout(() => btn.classList.remove('flash'), 300);

    fetch('/bet', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ side })
    }).catch(() => { statusEl.textContent = 'bet failed'; });
  }
</script>
</body>
</html>
