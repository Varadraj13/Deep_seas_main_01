<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Screen</title>
<script src="js/config.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--fg);
    /* Brighten secondary text to white for legibility on the projected screen */
    --muted: #ffffff;
    --faint: #cfcfcf;
    font-family: var(--font-text);
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* ── HEADER ──────────────────────────────────────────────────── */
  header {
    padding: 18px 28px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .contract-q {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    max-width: 420px;
    line-height: 1.6;
  }
  .contract-q span { color: var(--fg); }
  .header-layers {
    display: flex;
    gap: 36px;
    align-items: baseline;
  }
  .header-layer {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  .layer-label {
    font-size: 8px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .layer-val {
    font-family: var(--font-data);
    font-size: 22px;
    font-weight: 300;
    letter-spacing: -0.02em;
    color: var(--fg);
  }
  #gapBox .layer-val { color: var(--muted); }
  #gapBox.wide .layer-val { color: #ef4444; font-weight: 500; }

  /* ── MAIN GRID ────────────────────────────────────────────────── */
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    overflow: hidden;
  }

  .side {
    background: var(--bg);
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 20px 24px 14px;
    overflow: hidden;
  }

  .side-header {
    margin-bottom: 14px;
  }

  .side-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .side-label {
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .yes .side-label { color: #22c55e; }
  .no  .side-label { color: #ef4444; }

  .side-price {
    font-family: var(--font-data);
    font-size: 32px;
    font-weight: 300;
    letter-spacing: -0.02em;
  }
  .yes .side-price { color: #22c55e; }
  .no  .side-price { color: #ef4444; }

  .side-meta {
    font-family: var(--font-data);
    display: flex;
    gap: 16px;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .side-payout { color: var(--fg); font-weight: 500; }

  /* ── CHART ────────────────────────────────────────────────────── */
  .chart-wrap {
    position: relative;
    overflow: hidden;
    min-height: 80px;
  }
  .chart-container {
    width: 100%;
    height: 100%;
  }

  /* ── LEADERBOARD ─────────────────────────────────────────────── */
  .leaderboard {
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }
  .lb-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    padding: 3px 0;
    font-size: 9px;
    letter-spacing: 0.06em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-name { color: var(--fg); }
  .lb-amt  { text-align: right; color: var(--muted); font-family: var(--font-data); }

  /* ── FOOTER ───────────────────────────────────────────────────── */
  footer {
    padding: 10px 28px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    overflow: hidden;
  }
  #txFeed {
    font-family: var(--font-data);
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  #txFeed .tx-item { margin-right: 28px; }
  #txFeed .tx-open   { color: #22c55e; }
  #txFeed .tx-closed { color: #ef4444; }
  .footer-right {
    font-family: var(--font-data);
    font-size: 9px;
    color: var(--faint);
    letter-spacing: 0.1em;
    white-space: nowrap;
  }
</style>
</head>
<body>

<!-- ── VIDEO PLAYBACK MODE ────────────────────────────────────────── -->
<div id="video-mode" style="position:fixed;inset:0;background:#ffffff;z-index:9999;display:none;">
  <video id="bgVideo" autoplay loop muted playsinline
    style="width:100vw;height:100vh;object-fit:cover;display:block;"></video>
</div>

<!-- ── SIMULATION MODE ───────────────────────────────────────────── -->
<div id="sim-mode" style="display:contents;">

<header>
  <div class="contract-q">
    <span>Will the Strait of Hormuz remain open?</span>
  </div>
  <div class="header-layers">
    <div class="header-layer">
      <span class="layer-label">Ground Truth</span>
      <span class="layer-val" id="truthOpen">—</span>
    </div>
    <div class="header-layer">
      <span class="layer-label">The Market</span>
      <span class="layer-val" id="audiencePrice">$50</span>
    </div>
    <div class="header-layer" id="gapBox">
      <span class="layer-label">Divergence</span>
      <span class="layer-val" id="gapVal">—</span>
    </div>
  </div>
</header>

<main>
  <!-- YES SIDE -->
  <div class="side yes">
    <div class="side-header">
      <div class="side-top">
        <div class="side-label">Open</div>
        <div class="side-price" id="yesPrice">$50</div>
      </div>
      <div class="side-meta">
        <span id="yesChance">50% chance</span>
        <span class="side-payout" id="yesPayout">pays —x</span>
        <span id="yesInvested">$50 in</span>
      </div>
    </div>
    <div class="chart-wrap">
      <div class="chart-container" id="yesChartContainer"></div>
    </div>
    <div class="leaderboard" id="yesLeaderboard"></div>
  </div>

  <!-- NO SIDE -->
  <div class="side no">
    <div class="side-header">
      <div class="side-top">
        <div class="side-label">Closed</div>
        <div class="side-price" id="noPrice">$50</div>
      </div>
      <div class="side-meta">
        <span id="noChance">50% chance</span>
        <span class="side-payout" id="noPayout">pays —x</span>
        <span id="noInvested">$50 in</span>
      </div>
    </div>
    <div class="chart-wrap">
      <div class="chart-container" id="noChartContainer"></div>
    </div>
    <div class="leaderboard" id="noLeaderboard"></div>
  </div>
</main>

<footer>
  <div id="txFeed">waiting for bets…</div>
  <div class="footer-right" id="connectedCount">— online</div>
</footer>

</div><!-- /#sim-mode -->

<!-- pre-show mapping helper (sequenceController glue is inert on this page) -->
<script src="js/sequenceController.js"></script>
<!-- ── MODE SWITCHING ─────────────────────────────────────────────── -->
<script>
  (function() {
    const modeChannel = new BroadcastChannel('hormuz-mode');
    modeChannel.onmessage = function(e) {
      const mode = e.data && e.data.mode;
      if (mode === 'video_playback') {
        document.getElementById('video-mode').style.display = 'block';
      } else if (mode === 'simulation') {
        document.getElementById('video-mode').style.display = 'none';
        resizeCharts();
      } else if (mode === 'preshow') {
        location.href = preshowPageForLivePath(location.pathname);
      }
    };
  })();
</script>

<script>
  // ── STATE ──────────────────────────────────────────────────────────
  let audienceMarketPrice = 0.5;
  let yesProb = 0.5;             // from hormuz-game (ground truth)
  let transactions = [];
  let byName = {};
  let connectedCount = 0;

  // ── TRADINGVIEW CHARTS ────────────────────────────────────────────
  const TV_OPTIONS_BASE = {
    layout:      { background: { color: '#0a0a0a' }, textColor: '#888' },
    grid:        { vertLines: { color: '#1a1a1a' }, horzLines: { color: '#1a1a1a' } },
    crosshair:   { mode: 0 },
    rightPriceScale: { visible: false },
    leftPriceScale:  { visible: false },
    timeScale:   { visible: false, borderVisible: false },
    handleScroll:  false,
    handleScale:   false,
  };

  function makeChart(containerId, lineColor, topColor) {
    const el = document.getElementById(containerId);
    const chart = LightweightCharts.createChart(el, {
      ...TV_OPTIONS_BASE,
      width:  el.clientWidth  || 300,
      height: el.clientHeight || 120,
    });
    const series = chart.addAreaSeries({
      lineColor,
      topColor,
      bottomColor: 'rgba(255,255,255,0)',
      lineWidth: 2,
      priceLineVisible: false,
      lastValueVisible: false,
    });
    // Seed with the starting point so there's something to show
    series.setData([{ time: Math.floor(Date.now() / 1000), value: 0.5 }]);
    return { chart, series };
  }

  let yesTV, noTV;

  window.addEventListener('load', () => {
    yesTV = makeChart('yesChartContainer', '#22c55e', 'rgba(34,197,94,0.12)');
    noTV  = makeChart('noChartContainer',  '#ef4444', 'rgba(239,68,68,0.12)');
  });

  function resizeCharts() {
    if (!yesTV) return;
    const yEl = document.getElementById('yesChartContainer');
    const nEl = document.getElementById('noChartContainer');
    yesTV.chart.applyOptions({ width: yEl.clientWidth, height: yEl.clientHeight });
    noTV.chart.applyOptions({ width: nEl.clientWidth, height: nEl.clientHeight });
  }

  window.addEventListener('resize', resizeCharts);

  function pushPriceToCharts(price) {
    const t = Math.floor(Date.now() / 1000);
    if (yesTV) yesTV.series.update({ time: t, value: price });
    if (noTV)  noTV.series.update({ time: t, value: 1 - price });
  }

  // ── AUDIENCE WS ───────────────────────────────────────────────────
  const audienceWs = new WebSocket(SERVER_URL.replace(/^http/, 'ws'));
  audienceWs.onmessage = function(e) {
    const msg = JSON.parse(e.data);
    audienceMarketPrice = msg.marketPrice;
    transactions  = msg.transactions  || [];
    byName        = msg.byName        || {};
    connectedCount = msg.connectedCount || 0;
    updateDisplay();
    pushPriceToCharts(audienceMarketPrice);
  };

  // ── HORMUZ-GAME (ground truth from simulator) ─────────────────────
  const hormuzChannel = new BroadcastChannel('hormuz-game');
  hormuzChannel.onmessage = function(e) {
    const msg = e.data;
    yesProb = (100 - msg.shipProbability) / 100;
    document.getElementById('truthOpen').textContent =
      '$' + Math.round(yesProb * 100);
    updateDivergence();
  };

  // ── DISPLAY ───────────────────────────────────────────────────────
  function updateDisplay() {
    const price    = audienceMarketPrice;
    const yesCents = Math.round(price * 100);
    const noCents  = 100 - yesCents;

    document.getElementById('audiencePrice').textContent = '$' + yesCents;
    document.getElementById('yesPrice').textContent      = '$' + yesCents;
    document.getElementById('noPrice').textContent       = '$' + noCents;
    document.getElementById('yesChance').textContent     = yesCents + '% chance';
    document.getElementById('noChance').textContent      = noCents  + '% chance';

    // Payout multiples
    const yesPay = price > 0 ? (1 / price).toFixed(2) : '—';
    const noPay  = price < 1 ? (1 / (1 - price)).toFixed(2) : '—';
    document.getElementById('yesPayout').textContent = 'pays ' + yesPay + 'x';
    document.getElementById('noPayout').textContent  = 'pays ' + noPay  + 'x';

    // Invested totals (from server)
    const openDollars   = byName ? Object.values(byName).reduce((s, v) => s + (v['open$'] || 0), 0) : 0;
    const closedDollars = byName ? Object.values(byName).reduce((s, v) => s + (v['closed$'] || 0), 0) : 0;
    document.getElementById('yesInvested').textContent = '$' + openDollars   + ' in';
    document.getElementById('noInvested').textContent  = '$' + closedDollars + ' in';

    document.getElementById('connectedCount').textContent =
      connectedCount + ' online';

    updateDivergence();
    renderLeaderboards();
    renderTxFeed();
  }

  function updateDivergence() {
    const truthCents = Math.round(yesProb * 100);
    const crowdCents = Math.round(audienceMarketPrice * 100);
    const gap = Math.abs(truthCents - crowdCents);
    document.getElementById('gapVal').textContent = gap + '¢';
    document.getElementById('gapBox').classList.toggle('wide', gap >= 10);
  }

  function renderLeaderboards() {
    if (!byName) return;

    // YES leaderboard — people who bet OPEN
    const yesPlayers = Object.entries(byName)
      .filter(([, v]) => v['open$'] > 0)
      .sort(([, a], [, b]) => b['open$'] - a['open$'])
      .slice(0, 4);

    document.getElementById('yesLeaderboard').innerHTML =
      yesPlayers.map(([name, v]) =>
        `<div class="lb-row"><span class="lb-name">${name}</span><span class="lb-amt">$${v['open$']}</span></div>`
      ).join('');

    // NO leaderboard — people who bet CLOSED
    const noPlayers = Object.entries(byName)
      .filter(([, v]) => v['closed$'] > 0)
      .sort(([, a], [, b]) => b['closed$'] - a['closed$'])
      .slice(0, 4);

    document.getElementById('noLeaderboard').innerHTML =
      noPlayers.map(([name, v]) =>
        `<div class="lb-row"><span class="lb-name">${name}</span><span class="lb-amt">$${v['closed$']}</span></div>`
      ).join('');
  }

  function renderTxFeed() {
    if (!transactions || transactions.length === 0) return;
    const recent = [...transactions].reverse().slice(0, 6);
    document.getElementById('txFeed').innerHTML = recent.map(tx => {
      const cls = tx.side === 'open' ? 'tx-open' : 'tx-closed';
      const label = tx.side === 'open' ? 'OPEN' : 'CLOSED';
      return `<span class="tx-item"><span class="${cls}">+ ${tx.name} $${tx.amount} ${label}</span></span>`;
    }).join('');
  }
</script>

<!-- Heartbeat responder — lets control-center detect this tab is open -->
<script>
(function(){
  var hb = new BroadcastChannel('hormuz-heartbeat');
  hb.onmessage = function(e){ if (e.data && e.data.ping) hb.postMessage({ pong: 'market' }); };
})();
</script>

</body>
</html>
